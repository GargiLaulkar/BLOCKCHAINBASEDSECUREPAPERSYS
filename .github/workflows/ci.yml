name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linters
        run: |
          pnpm --filter @sigil/contracts lint
          pnpm -r --if-present lint

      - name: Build shared schemas and verify OpenAPI contract
        run: |
          pnpm --filter @sigil/core build
          pnpm --filter @sigil/backend openapi:generate
          git diff --exit-code -- docs/api/openapi.json frontend/src/api/generated.ts

      - name: Typecheck generated frontend API types
        run: pnpm --filter @sigil/backend exec -- tsc -p ../frontend/tsconfig.json

      - name: Compile contracts for TypeChain types
        run: pnpm --filter @sigil/contracts exec hardhat compile

      - name: Build contracts-types package
        run: |
          node scripts/export-abi.mjs
          pnpm --filter @sigil/contracts-types build

      - name: Generate Prisma Client
        run: pnpm --filter @sigil/backend exec prisma generate --schema prisma/schema.prisma

      - name: Run Typechecks
        run: |
          pnpm --filter @sigil/contracts typecheck
          pnpm -r --if-present typecheck

      - name: Run Smart Contract Tests
        run: pnpm --filter @sigil/contracts test

      - name: Run Smart Contract Coverage
        run: pnpm --filter @sigil/contracts coverage

      - name: Enforce Coverage Thresholds
        run: pnpm --filter @sigil/contracts coverage:check

      - name: Run Core Tests
        run: pnpm --filter @sigil/core test

      - name: Run Backend Tests
        run: |
          set -euo pipefail
          pnpm --filter @sigil/contracts exec hardhat node --hostname 127.0.0.1 > "$RUNNER_TEMP/hardhat-node.log" 2>&1 &
          node_pid=$!
          cleanup() {
            kill "$node_pid" 2>/dev/null || true
            pkill -f "hardhat node" 2>/dev/null || true
            rm -f contracts/deployments/localhost.json
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q '"result":"0x7a69"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/hardhat-node.log"
            exit 1
          fi

          pnpm --filter @sigil/contracts exec hardhat run scripts/deploy.ts --network localhost

          CONTRACT_ADDRESS=$(node -p 'require("./contracts/deployments/localhost.json").address')
          DEPLOY_BLOCK=$(node -p 'require("./contracts/deployments/localhost.json").blockNumber')

          mkdir -p "$RUNNER_TEMP/uploads"

          DATABASE_URL="postgresql://localhost:5432/test" \
          SESSION_SECRET="super-secret-session-key-at-least-32-characters-long" \
          RPC_URL="http://127.0.0.1:8545" \
          CHAIN_ID=31337 \
          CONTRACT_ADDRESS="$CONTRACT_ADDRESS" \
          DEPLOY_BLOCK="$DEPLOY_BLOCK" \
          FRONTEND_ORIGIN="http://localhost:5173" \
          BLOB_DIR="$RUNNER_TEMP/uploads" \
          pnpm --filter @sigil/backend test

      - name: Verify Contract Spec is Up to Date (No Drift)
        run: |
          pnpm --filter @sigil/contracts docs:contract
          git diff --exit-code docs/contract-spec.md

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage-report
          path: |
            contracts/coverage/
            contracts/coverage.json
          retention-days: 14

