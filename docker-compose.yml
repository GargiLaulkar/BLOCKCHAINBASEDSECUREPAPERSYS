version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigil
      POSTGRES_PASSWORD: sigil_password
      POSTGRES_DB: sigil_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigil -d sigil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
